function updateList(){const target=el('#trade-rows');if(!target)return;let html='';if(tab==='items'){sampleItems.filter(i=>i.name.toLowerCase().includes(search.toLowerCase())).forEach(it=>{const included=!!list().find(p=>p.id===it.id);html+=`<div class="item" onclick="add(${it.id})">${pic(it)}<div class="itemtxt"><div class="name">${it.name}</div><div class="sub">${mode==='sell'?'В инвентаре':'Каталог'} · ${mode==='sell'?it.stock+' шт.':'добавить в скупку'}</div></div><button class="tinybtn ${included?'mutedbtn':''}" onclick="event.stopPropagation();add(${it.id})">${included?'✓ Добавлен':'+ Добавить'}</button></div>`;})}else{list().forEach((p,i)=>{let it=itemById(p.id);html+=`<div class="item">${pic(it)}<div class="itemtxt"><div class="name">${it.name}</div><div class="sub">${p.price>0?'Готов к выставлению':'Укажите цену за 1 шт.'}</div></div><div class="rowinputs"><div class="cell"><label>Цена, $</label><input inputmode="numeric" type="number" min="0" value="${p.price||''}" placeholder="0" onchange="presets['${mode}'][${i}].price=Math.max(0,+this.value||0);render()"></div><div class="cell qty"><label>Штук</label><input inputmode="numeric" type="number" min="1" value="${p.qty}" onchange="presets['${mode}'][${i}].qty=Math.max(1,Math.min(${mode==='sell'?it.stock:999999},+this.value||1));render()"></div><button class="remove" title="Убрать предмет" onclick="list().splice(${i},1);render()">×</button></div></div>`;})}target.innerHTML=html||'<div class="sub" style="padding:20px">Пока нет предметов</div>'}

function shopSummary(){if(shopsView==='stall'){let shop=mockShops.find(s=>s.id===shopsSelectedShop);return shop?`${shopSearchOffers(shop[shopsMode].map(o=>({...o,owner:shop.owner,shopId:shop.id})),shopsQuery).length} позиций · лавка №${shop.id}`:'Нет данных';}if(shopsView==='offers'){let o=shopSearchOffers(flatOffers(shopsMode).filter(o=>o.item===shopsSelectedItem),shopsQuery);return `${o.length} лавок · ${o.reduce((s,x)=>s+x.qty,0).toLocaleString('ru-RU')} шт. всего`;}const g=groupedOffers();return `${g.length} товаров · ${g.reduce((s,x)=>s+x.offers.length,0)} предложений`;}
function shopRows(){const sell=shopsMode==='sell';if(shopsView==='items'){
return groupedOffers().map(g=>`<button class="item shop-item" onclick="shopsOpenItem(${g.id})">${pic(itemById(g.id))}<div class="itemtxt"><div class="name">${esc(itemById(g.id).name)}</div><div class="sub">${g.offers.length} лавки · всего ${g.qty.toLocaleString('ru-RU')} шт.</div></div><div class="shop-amount"><strong class="num">${money(g.best.price)}</strong><div class="sub">${sell?'от':'до'} /шт.</div></div><span class="arr">›</span></button>`).join('')||'<div class="shop-empty">Ничего не найдено. Попробуйте название предмета, ник или номер лавки.</div>';
}
if(shopsView==='offers'){
const matches=shopSortOffers(shopSearchOffers(flatOffers(shopsMode).filter(o=>o.item===shopsSelectedItem),shopsQuery));
return matches.map(o=>`<div class="item shop-item"><div class="itemtxt" onclick="shopsOpenShop(${o.shopId})"><div class="name">${esc(o.owner)} <span class="shop-badge">№${o.shopId}</span></div><div class="sub">${sell?'Продаёт':'Скупает'} ${o.qty.toLocaleString('ru-RU')} шт. · открыть лавку ›</div></div><div class="shop-amount" onclick="shopsOpenShop(${o.shopId})"><strong class="num">${money(o.price)}</strong><div class="sub">за 1 шт.</div></div><button class="shop-shopbtn" title="Отметить лавку в игре" onclick="toast('Демо: метка лавки №${o.shopId}')">⌖</button></div>`).join('')||'<div class="shop-empty">У этого товара нет подходящих предложений.</div>';
}
const shop=mockShops.find(s=>s.id===shopsSelectedShop);if(!shop)return '<div class="shop-empty">Лавка не найдена</div>';
return shopSortOffers(shopSearchOffers(shop[shopsMode].map(o=>({...o,shopId:shop.id,owner:shop.owner})),shopsQuery)).map(o=>`<div class="item shop-item">${pic(itemById(o.item))}<div class="itemtxt"><div class="name">${esc(itemById(o.item).name)}</div><div class="sub">${sell?'В продаже':'Скупает'} · ${o.qty.toLocaleString('ru-RU')} шт.</div></div><div class="shop-amount"><strong class="num">${money(o.price)}</strong><div class="sub">за 1 шт.</div></div></div>`).join('')||'<div class="shop-empty">Нет товаров в выбранной категории.</div>';
}
function shops(){const sell=shopsMode==='sell',shop=mockShops.find(s=>s.id===shopsSelectedShop);const title=shopsView==='items'?'Лавки':shopsView==='offers'?esc(itemById(shopsSelectedItem).name):`Лавка №${shop.id}`;
return `<div class="shop-header">${shopsView!=='items'?'<button class="backbtn shop-back" onclick="shopsBack()">‹ Назад</button>':''}<div class="title">${title}</div>${shopsView==='stall'?`<span class="shop-secondary">${esc(shop.owner)}</span>`:shopsView==='items'?'<span class="subtitle">Рынок игроков</span>':''}<div class="grow"></div><span class="shop-counter">Демо-данные</span><button class="pill" onclick="toast('Демо: обновление рынка не подключено')">↻</button></div>
<div class="sectiontop shop-controls"><div class="tabs shop-tabs"><button class="${sell?'active':''}" onclick="shopsSelectMode('sell')">Продают</button><button class="${!sell?'active':''}" onclick="shopsSelectMode('buy')">Скупают</button></div><input id="shops-query" class="search shop-search" value="${esc(shopsQuery)}" oninput="shopsUpdateSearch(this.value)" placeholder="⌕ Предмет, ник, № лавки"></div>
<div class="shop-minihead"><span id="shop-count">${shopSummary()}</span> <span style="float:right">${sell?'Купить у игроков':'Продать игрокам'}</span></div>
<div class="scroll" id="shops-scroll"><div class="list" id="shop-rows">${shopRows()}</div></div>
<div class="footer shop-footer"><span class="footerstats">${shopsView==='stall'?`Лавка №${shop.id} · ${esc(shop.owner)}`:'Mobile II · данные демонстрационные'}</span><div class="grow"></div><button class="arrowbtn" onclick="scrollRows(-1)">↑</button><button class="arrowbtn" onclick="scrollRows(1)">↓</button>${shopsView==='stall'?`<button class="btn blue" onclick="toast('Демо: метка лавки №${shop.id}')">⌖ Метка</button>`:`<button class="btn" onclick="shopsToggleSort()">${shopsSort==='best'?'Цена '+(sell?'↑':'↓'):'Цена '+(sell?'↓':'↑')}</button>`}</div>`;}

const sellers=[{owner:'Shota_777',qty:1,price:1000000,stall:'Лавка №12'},{owner:'ALX Market',qty:1,price:1010000,stall:'Лавка №34'},{owner:'Framer_01',qty:1,price:1020000,stall:'Лавка №52'}];const buyers=[{owner:'BestBuyer',qty:700,price:1100000,stall:'Лавка №6'},{owner:'MarketPro',qty:25,price:1050000,stall:'Лавка №89'}];const marked=()=>chosen.length;function sums(){let cost=chosen.reduce((a,i)=>a+sellers[i].price,0),sale=chosen.reduce((a,i)=>a+buyers[buyer].price,0),fee=sale*.01;return {cost,sale,net:sale-cost-fee,fee}}
function arbitrage(){if(detail)return arbDetail();return `<div class="head"><div class="title">Арбитраж</div><span class="subtitle">3 предмета · обновлено 25 сек назад</span><div class="grow"></div><button class="pill" onclick="toast('Запрос обновления рынка')">↻ Обновить</button></div><div class="sectiontop"><input class="search" style="max-width:none;width:100%" placeholder="⌕  Поиск по рынку" oninput="document.querySelectorAll('.arbitem').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')"></div><div class="scroll" id="arb-scroll"><div class="list"><div class="item arbitem" onclick="detail=true;render()">${pic(itemById(1))}<div class="itemtxt"><div class="name">Кейс Frame</div><div class="sub">3 продают · спрос 700 шт.</div></div><div style="text-align:right"><div class="profit">+237 000 $</div><div class="sub">3 шт. по плану</div></div><span class="arr">›</span></div><div class="item arbitem" onclick="detail=true;render()">${pic(itemById(2))}<div class="itemtxt"><div class="name">Бронежилет</div><div class="sub">8 продают · спрос 45 шт.</div></div><div style="text-align:right"><div class="profit">+87 000 $</div><div class="sub">8 шт. по плану</div></div><span class="arr">›</span></div><div class="item arbitem" onclick="detail=true;render()">${pic(itemById(6))}<div class="itemtxt"><div class="name">Рюкзак путешественника</div><div class="sub">2 продают · спрос 10 шт.</div></div><div style="text-align:right"><div class="profit">+41 000 $</div><div class="sub">2 шт. по плану</div></div><span class="arr">›</span></div></div></div><div class="footer"><span class="footerstats">Цены и количество — снимок API, не гарантия наличия</span><div class="grow"></div><button class="arrowbtn" onclick="scrollRows(-1)">↑</button><button class="arrowbtn" onclick="scrollRows(1)">↓</button></div>`}
function arbDetail(){let s=sums(),price=buyers[buyer].price;return `<div class="head"><button class="backbtn" onclick="detail=false;render()">‹ Назад</button>${pic(itemById(1))}<div><div class="title">Кейс Frame</div><div class="subtitle">Данные API · 25 сек назад</div></div><div class="grow"></div><button class="pill" onclick="toast('Запрос обновления объёмов')">↻</button></div><div class="summaryline"><div><div class="tag">Выставлено</div><div class="big">3 шт.</div></div><div class="vl"></div><div><div class="tag">Спрос</div><div class="big">700 шт.</div></div><div class="vl"></div><div><div class="tag">Ваш план</div><div class="big" style="color:var(--blue)">${marked()} шт.</div></div><div class="grow"></div><div class="profit" style="font-size:17px">${money(s.net)} <span class="sub" style="display:inline">чистыми</span></div></div><div class="sectiontop"><div class="tabs"><button class="${arbTab==='sellers'?'active':''}" onclick="arbTab='sellers';render()">Продают (3)</button><button class="${arbTab==='buyers'?'active':''}" onclick="arbTab='buyers';render()">Скупают (2)</button></div><span class="mini">Выберите лавки</span></div><div class="scroll" id="arb-scroll"><div class="list">${arbTab==='sellers'?sellers.map((it,i)=>`<div class="item" onclick="const ix=chosen.indexOf(${i});ix<0?chosen.push(${i}):chosen.splice(ix,1);render()"><input class="check" type="checkbox" ${chosen.includes(i)?'checked':''} onclick="event.stopPropagation();const ix=chosen.indexOf(${i});ix<0?chosen.push(${i}):chosen.splice(ix,1);render()"><div class="itemtxt"><div class="name">${it.owner}</div><div class="sub">${it.stall} · ${it.qty} шт.</div></div><div style="text-align:right"><div class="num">${money(it.price)}/шт</div><div class="sub">Прибыль ${money(price-it.price-price*.01)}</div></div></div>`).join(''):buyers.map((it,i)=>`<div class="item" onclick="buyer=${i};render()"><input class="check" type="radio" name="buyer" ${buyer===i?'checked':''}><div class="itemtxt"><div class="name">${it.owner}</div><div class="sub">${it.stall} · принимает ${it.qty} шт.</div></div><div style="text-align:right"><div class="num">${money(it.price)}/шт</div><div class="sub">Спрос подтверждён только API</div></div></div>`).join('')}</div></div><div class="footer"><div class="footerstats">Купить <b>${money(s.cost)}</b> · Продать <b>${money(s.sale)}</b> · Комиссия <b>${money(s.fee)}</b></div><div class="grow"></div><button class="btn" onclick="chosen=[0,1,2];buyer=0;render()">Лучший план</button><button class="btn blue" onclick="dialog='route';render()">Маршрут ›</button></div>`}
const ev=[{cat:'Награды',type:'Кейс Frame',detail:'Получен предмет из кейса',amt:'',time:'20:46'}, {cat:'PayDay',type:'PayDay · зарплата и налог',detail:'Начислено 15 000 $; налог 750 $',amt:'+14 250 $',time:'20:00'}, {cat:'Продажи',type:'Продан бронежилет',detail:'Продажа 1 шт. за 420 000 $',amt:'+420 000 $',time:'19:48'}, {cat:'Награды',type:'Тайник · источник неизвестен',detail:'Награда распознана, исходный тип требует подтверждения',amt:'',time:'19:29'}, {cat:'Скупка',type:'Куплены металлические детали',detail:'Куплено 5 шт.',amt:'−20 000 $',time:'19:12'}, {cat:'Доходы',type:'Доход от подработки',detail:'Зачисление 30 000 $',amt:'+30 000 $',time:'18:51'}];
function journal(){let e=ev.filter(it=>jFilter==='Все'||(jFilter==='Награды'?it.cat==='Награды':it.cat===jFilter));return `<div class="journal"><div class="top"><span class="logo">Журнал</span><div class="grow"></div><button class="iconbtn" onclick="journalOpen=false;render()">×</button></div><div class="jfilters">${['Все','Награды','PayDay','Продажи','Скупка','Доходы'].map(c=>`<button class="${jFilter===c?'active':''}" onclick="jFilter='${c}';render()">${c}</button>`).join('')}</div><div class="scroll" id="journal-scroll">${e.map((it,i)=>`<button class="jevent" onclick="dialog='event:${ev.indexOf(it)}';render()"><span class="jdot" style="background:${it.cat==='PayDay'?'#ffd084':it.cat==='Продажи'?'#50daab':'#58a5ff'}"></span><span class="time">${it.time}</span><span class="eventname">${it.type}</span><span class="${it.amt.startsWith('+')?'profit':'num'}" style="font-size:11px">${it.amt}</span><span class="arr" style="font-size:15px">›</span></button>`).join('')}</div><div class="jbottom"><span>Сессия · 6 событий</span><span>Доходы <b>+464 250 $</b></span></div></div>`}
function calculator(){return `<div class="head"><div class="title">Калькулятор</div><span class="subtitle">Обычный и торговый</span><div class="grow"></div><button class="pill" onclick="dialog='calcHistory';render()">История ▤</button></div><div class="calcb"><div class="calcmain"><div class="calcdisplay">${esc(calcInput)}</div><div class="keys">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','00','.','='].map(k=>`<button class="${['÷','×','−','+','='].includes(k)?'op':['AC','±','%'].includes(k)?'spec':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div></div><div class="calcside"><h3>Прибыль от сделки</h3><div class="pair"><div><label>Закупка, $</label><input class="cinput" id="calc-buy" type="number" value="1000000" oninput="calcProfit()"></div><div><label>Продажа, $</label><input class="cinput" id="calc-sell" type="number" value="1100000" oninput="calcProfit()"></div></div><div class="pair"><div><label>Количество</label><input class="cinput" id="calc-qty" type="number" value="3" oninput="calcProfit()"></div><div><label>Комиссия, %</label><input class="cinput" id="calc-fee" type="number" value="1" oninput="calcProfit()"></div></div><div class="calcresult"><span>Чистая прибыль</span><strong id="calc-result">267 000 $</strong></div></div></div>`}
function calcProfit(){const b=Number(el('#calc-buy')?.value)||0,s=Number(el('#calc-sell')?.value)||0,q=Number(el('#calc-qty')?.value)||0,f=Number(el('#calc-fee')?.value)||0,t=el('#calc-result');if(t)t.textContent=money((s-b-s*f/100)*q)}
function calcPress(k){const n=Number(calcInput)||0;if(k==='AC'){calcInput='0';calcOld=null;calcOp=null}else if(k==='±'){calcInput=String(-n)}else if(k==='%'){calcInput=String(n/100)}else if(['+','−','×','÷'].includes(k)){calcOld=n;calcOp=k;calcInput='0'}else if(k==='='){if(calcOld!==null){let y=calcOp==='+'?calcOld+n:calcOp==='−'?calcOld-n:calcOp==='×'?calcOld*n:n===0?NaN:calcOld/n;calcInput=Number.isFinite(y)?String(Math.round(y*1e8)/1e8):'Ошибка';calcOld=null}}else if(k==='.'){if(!calcInput.includes('.'))calcInput+='.'}else calcInput=calcInput==='0'?k:calcInput+k;render()}
function settings(){return `<div class="head"><div class="title">Настройки</div></div><div class="scroll"><div class="list"><div class="item"><div class="itemtxt"><div class="name">Дизайн</div><div class="sub">Тёмная тема · компактные строки · боковая навигация</div></div><span class="mini">Активно</span></div><div class="item"><div class="itemtxt"><div class="name">Рынок</div><div class="sub">Фоновое обновление по возможности</div></div><span class="mini">Включено</span></div><div class="item"><div class="itemtxt"><div class="name">Журнал событий</div><div class="sub">Выбираемые категории для записи и показа</div></div></div></div></div>`}
function menu(){return `<div class="drawerback" onclick="drawer=false;render()"><div class="drawer" onclick="event.stopPropagation()"><div class="drawtitle">Разделы</div>${[['trade','▤','Торговля'],['shops','▦','Лавки'],['arb','⇄','Арбитраж'],['journal','≡','Мини-журнал'],['calc','▦','Калькулятор'],['settings','⚙','Настройки']].map(([v,ico,t])=>`<button class="navbtn ${(v==='journal'?journalOpen:view===v)?'active':''}" onclick="setNav('${v}')"><b>${ico}</b>${t}</button>`).join('')}<div class="navmuted">Palatka AI — прототип интерфейса.<br>Данные демонстрационные, игрового подключения нет.</div></div></div>`}
function modalContent(){if(!dialog)return '';let content='';if(dialog==='launch')content=`<h2>Выставление · ${mode==='sell'?'Продажа':'Скупка'}</h2><p>${list().length} позиции в пресете. ${list().filter(p=>!p.price).length} без цены — такие нельзя выставлять.</p><div class="modalactions"><button class="btn" onclick="dialog=null;render()">Отмена</button><button class="btn" onclick="dialog='review';render()">Проверить список</button><button class="btn blue" onclick="toast('Демо: запрос выставления не отправлялся');dialog=null">Быстро выставить</button></div>`;else if(dialog==='review')content=`<h2>Проверка списка</h2><div style="max-height:180px;overflow:auto">${list().map(p=>`<div class="item" style="height:36px;margin:3px 0"><span class="itemtxt">${itemById(p.id).name}</span><span>${p.qty} шт. · ${p.price?money(p.price):'НЕТ ЦЕНЫ'}</span></div>`).join('')}</div><div class="modalactions"><button class="btn" onclick="dialog=null;render()">Назад</button><button class="btn blue" onclick="toast('Демо: запуск не выполняется');dialog=null">Подтвердить</button></div>`;else if(dialog==='route')content=`<h2>Маршрут · Кейс Frame</h2><p>Сначала покупка, затем продажа скупщику. Все количества рассчитаны по снимку API.</p>${chosen.map(i=>`<div class="item" style="height:37px;margin:3px 0"><span class="itemtxt">Купить 1 шт. · ${sellers[i].stall}</span><b>${money(sellers[i].price)}</b></div>`).join('')}<div class="item" style="height:37px;margin:3px 0"><span class="itemtxt">Продать ${marked()} шт. · ${buyers[buyer].stall}</span><b class="profit">${money(sums().sale)}</b></div><div class="modalactions"><button class="btn blue" onclick="dialog=null;render()">Готово</button></div>`;else if(dialog.startsWith('event:')){let it=ev[+dialog.slice(6)];content=`<h2>${it.type}</h2><p>Время: ${it.time} · Категория: ${it.cat}</p><p>${it.detail}</p><p>Пример данных журнала для макета, не реальный игровой лог.</p><div class="modalactions"><button class="btn blue" onclick="dialog=null;render()">Закрыть</button></div>`}else if(dialog==='rename')content=`<h2>Пресет</h2><p>Переименование и управление пресетами (пример интерфейса)</p><input id="rename-in" style="width:100%;padding:9px" value="${esc(presetName)}"><div class="modalactions"><button class="btn" onclick="dialog='delete';render()">Удалить</button><button class="btn blue" onclick="presetName=el('#rename-in').value;dialog=null;render()">Сохранить</button></div>`;else if(dialog==='delete')content=`<h2>Удалить пресет?</h2><p>Удаление необратимо. Это отдельное окно подтверждения, не кнопка под списком.</p><div class="modalactions"><button class="btn" onclick="dialog=null;render()">Отмена</button><button class="btn blue" onclick="presetName='Новый';presets[mode]=[];dialog=null;render()">Удалить</button></div>`;else content=`<h2>История расчётов</h2><p>Пример: 1 000 000 × 3 = 3 000 000</p><div class="modalactions"><button class="btn blue" onclick="dialog=null;render()">Закрыть</button></div>`;return `<div class="overlay" onclick="dialog=null;render()"><div class="modal" onclick="event.stopPropagation()">${content}</div></div>`}
function render(){const root=el('#root');root.innerHTML=`<div class="app">${topbar()}<div class="screen">${view==='trade'?trade():view==='shops'?shops():view==='arb'?arbitrage():view==='calc'?calculator():settings()}</div>${drawer?menu():''}${toastMsg?`<div class="toast">${toastMsg}</div>`:''}</div>${journalOpen?journal():''}${dialog?modalContent():''}`;if(view==='trade')updateList();if(view==='calc')calcProfit()}window.render=render;window.add=add;window.setNav=setNav;window.toast=toast;window.updateList=updateList;window.scrollRows=scrollRows;window.calcPress=calcPress;window.calcProfit=calcProfit;render();
</script></body></html>
