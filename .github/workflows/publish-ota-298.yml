name: Publish Palatka 2.9.8 in-game OTA
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palatka-ota-298-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit
      - name: Compile standalone and test new logic
        run: |
          python3 build.py
          luajit tests/test_v298_fast_rec.lua
          luajit tests/test_v298_promo.lua
          luajit tests/test_v297_controls.lua
          luajit tests/test_v297_agent_persistence.lua
          luajit tests/test_v297_promo_scheduler.lua
          luajit tests/test_v297_unavailable_rollback.lua
      - name: Generate OTA and manifest
        run: |
          python3 tools/build_ota_298.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert manifest['version']=='2.9.8'
          assert manifest['mode']=='overlay'
          payload=Path('updates/palatka_update.lua').read_bytes()
          assert len(payload)==manifest['size']
          assert b"PALATKA_UPDATE_VERSION = '2.9.8'" in payload
          assert payload.endswith(b'  return install_v298()\nend\n')
          print('Verified OTA:',len(payload))
          PY
      - name: Commit and publish OTA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json updates/palatka_update.lua updates/palatka_update_v297.lua
          if git diff --cached --quiet; then
            echo '2.9.8 already published'
          else
            git commit -m 'release: publish Palatka AI 2.9.8 OTA'
            git push origin HEAD:main
          fi
