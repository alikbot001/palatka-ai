name: Palatka stable OTA gate
on:
  pull_request:
    paths:
      - 'updates/palatka_update.lua'
      - 'version.json'
      - 'src/**'
      - '.github/workflows/ota-syntax-guard.yml'
  push:
    branches: [main]
    paths:
      - 'updates/palatka_update.lua'
      - 'version.json'
      - 'src/**'
      - '.github/workflows/ota-syntax-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y luajit
      - name: Compile the exact OTA and stable stats source
        run: |
          luajit -b updates/palatka_update.lua /dev/null
          luajit -b src/59b_drop_sales_stats.lua /dev/null
          luajit -b src/68b_promo_universal_ui.lua /dev/null
          luajit -b src/69b_arbitrage_agent_ui.lua /dev/null
      - name: Reject mismatched or experimental OTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          meta=json.loads(Path("version.json").read_text(encoding="utf-8"))
          payload=Path("updates/palatka_update.lua").read_bytes()
          assert meta["version"]=="2.9.11",meta["version"]
          assert meta["mode"]=="overlay"
          assert len(payload)==meta["size"],(len(payload),meta["size"])
          assert b"PALATKA_UPDATE_VERSION = '2.9.11'" in payload[:300]
          assert b"local function install_v295()" in payload
          assert b"return install_v295()" in payload
          assert b"local function install_v296()" not in payload
          assert b"local function install_v2910()" not in payload
          print("STABLE OTA: LuaJIT syntax verified, exact bytes",len(payload))
          PY
      - name: Run stable promo, journal and arbitrage regressions
        run: |
          luajit tests/test_arbitrage_session.lua
          luajit tests/test_promo_templates.lua
          luajit tests/test_promo_scheduler_v294.lua
          luajit tests/test_mh_journal_screen_v294.lua
          luajit tests/test_drop_sales_stats.lua
