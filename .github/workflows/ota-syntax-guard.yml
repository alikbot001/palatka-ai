name: Palatka OTA syntax guard
on:
  push:
    branches: [main]
    paths:
      - 'updates/palatka_update.lua'
      - 'version.json'
      - 'src/72_promo_market_style_v298.lua'
      - 'src/73_fast_reconnect_v298.lua'
      - 'src/74_promo_save_v2910.lua'
      - 'src/59b_drop_sales_stats.lua'
      - 'src/65a_stats_v293.lua'
      - '.github/workflows/ota-syntax-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit
      - name: Compile and validate the exact OTA served to game
        run: |
          luajit -b src/72_promo_market_style_v298.lua /dev/null
          luajit -b src/73_fast_reconnect_v298.lua /dev/null
          luajit -b src/74_promo_save_v2910.lua /dev/null
          luajit -b src/59b_drop_sales_stats.lua /dev/null
          luajit -b updates/palatka_update.lua /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('version.json').read_text(encoding='utf-8'))
          ota=Path('updates/palatka_update.lua').read_bytes()
          assert len(ota)==data['size'],(len(ota),data['size'])
          assert b"PALATKA_UPDATE_VERSION = '"+data['version'].encode("ascii")+b"'" in ota
          assert data['mode']=='overlay'
          print('OTA compiles; exact manifest bytes:',len(ota))
          PY
      - name: Check Fast REC and promo regression tests
        run: |
          luajit tests/test_v298_fast_rec.lua
          luajit tests/test_v298_promo.lua
          luajit tests/test_v2910_promo_persistence.lua
          luajit tests/test_v2910_sales_receipts.lua
