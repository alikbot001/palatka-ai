name: Palatka storage OTA beta checks
on:
  push:
    branches:
      - feat/storage-readonly-probe-v1
      - fix/storage-smart-library-v281
      - refactor/storage-simple-v282
      - feat/storage-suggest-match-v283
      - feat/storage-detailed-search-v284
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'updates/**'
      - 'version.json'
      - '.github/workflows/storage-beta.yml'
jobs:
  storage-luajit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y luajit
      - name: Validate OTA overlay Lua syntax
        run: luajit -b updates/palatka_update.lua /dev/null
      - name: Test storage scanner models
        run: |
          set -e
          luajit tests/test_v250_storage_probe.lua
          luajit tests/test_v250_storage_probe_report.lua
          luajit tests/test_v250_storage_probe_ui.lua
          luajit tests/test_v250_storage_navigation.lua
          luajit tests/test_v250_trunk_named.lua
          luajit tests/test_v283_storage_matching.lua
          luajit tests/test_v283_storage_match_ui.lua
          luajit tests/test_v283_settings_safety.lua
          luajit tests/test_v283_trunk_capacity.lua
          luajit tests/test_v284_storage_search.lua
          luajit tests/test_v284_storage_search_ui.lua
