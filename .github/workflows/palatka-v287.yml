name: Palatka 2.9.3 production build
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'updates/**'
      - 'version.json'
      - 'build.py'
      - '.github/workflows/palatka-v287.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'updates/**'
      - 'version.json'
      - 'build.py'
      - '.github/workflows/palatka-v287.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y luajit
      - name: Compile new modules individually
        run: |
          for file in src/49a_promo_universal.lua src/68b_promo_universal_ui.lua src/69a_arbitrage_agent.lua src/69b_arbitrage_agent_ui.lua src/69c_arbitrage_status.lua; do
            echo "Compiling $file"
            luajit -b "$file" /dev/null
          done
      - name: Check arbitrage agent accounting
        run: luajit tests/test_arbitrage_session.lua
      - name: Check missing shop and item handling
        run: luajit tests/test_arbitrage_status.lua
      - name: Test universal promotion scheduler
        run: luajit tests/test_promo_universal.lua
      - name: Test named multi-row promo templates
        run: luajit tests/test_promo_templates.lua
      - name: Verify Cyrillic arbitration source strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = ['src/63_ui21_arbitrage.lua','src/63a_ui_local_arbitrage.lua',
                     'src/38_arbitrage_v16.lua','src/62_ui21_shops.lua']
          for p in targets:
              raw = Path(p).read_text(encoding='utf-8')
              assert any('\u0400' <= c <= '\u04FF' for c in raw), p
              bad = [c for c in raw if 'À' <= c <= 'ÿ']
              assert not bad, (p, bad[:12])
              print(p, 'Cyrillic source verified')
          PY
      - name: Test minimalist Market Helper-style trade journal
        run: luajit tests/test_mh_trade_feed.lua
      - name: Verify template editor uses inline rows and no nested line popup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('src/68b_promo_universal_ui.lua').read_text()
          log=Path('src/57a_trade_feed_mh.lua').read_text()
          assert "+ Добавить строку" in ui
          assert "##mhpromo_rows" in ui
          assert "InputTextWithHint('##line'" in ui
          assert "unipromo_line" not in ui
          assert "trade_feed_lines" in log
          print('MH-inspired editor and log UI verified')
          PY
      - name: Test MH-style promo template options
        run: luajit tests/test_promo_mh_options.lua
      - name: Test compact buy/sell journal
        run: luajit tests/test_mh_trade_journal.lua
      - name: Check every new module compiles
        run: |
          for lua in src/49b_promo_mh_options.lua src/59b_drop_sales_stats.lua src/60aa_touch_scroll.lua src/65a_stats_v293.lua src/66c_mh_trade_journal.lua src/68b_promo_universal_ui.lua src/69b_arbitrage_agent_ui.lua; do
            luajit -b "$lua" /dev/null
          done
      - name: Test drop/sale/inventory statistics
        run: luajit tests/test_drop_sales_stats.lua
      - name: Test touch-first UI without fixed scroll arrows
        run: luajit tests/test_touch_scroll_v293.lua
      - name: Verify active UI module order and runtime bindings
        run: |
          luajit tests/test_active_ui_runtime.lua
          python3 - <<'PY'
          from pathlib import Path
          src=Path('build.py').read_text()
          assert src.index('"66a_trade_log_tab_mh.lua"') < src.index('"66c_mh_trade_journal.lua"')
          assert src.index('"68_ui22_flip_promo.lua"') < src.index('"68b_promo_universal_ui.lua"')
          assert src.index('"69b_arbitrage_agent_ui.lua"') < src.index('"69d_runtime_diagnostic.lua"')
          ota=Path('updates/palatka_update.lua').read_text()
          assert 'local function _v293_src_69d_runtime_diagnostic()' in ota
          assert 'local function install_v293()' in ota
          PY
      - name: Verify OTA Lua syntax
        run: luajit -b updates/palatka_update.lua /dev/null
      - name: Verify OTA version and byte size
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('version.json').read_text())
          ota=Path('updates/palatka_update.lua').read_bytes()
          assert release['version']=='2.9.3'
          assert len(ota)==release['size'], (len(ota),release['size'])
          assert b"PALATKA_UPDATE_VERSION = '2.9.3'" in ota
          assert b'local function _v286_mcr_classic()' not in ota
          assert b'local function _v291_arb_agent_native()' in ota
          assert b'local function _v291_compact_journal()' in ota
          assert b'local function _v291_promo_ui()' in ota
          print('OTA version and size verified:',len(ota))
          PY
      - name: Build full standalone Palatka script
        run: python3 build.py
      - name: Verify original main UI and retained agent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data=Path('palatka_ai.lua').read_bytes()
          assert b'Palatka AI v2.9.3' in data[:1000]
          assert b'##palatka_arbitrage_agent' in data
          assert 'Сделки'.encode('cp1251') in data
          assert 'Добавить строку'.encode('cp1251') in data
          assert b'MCR CLASSIC  /  PALATKA AI' not in data
          assert 'Арбитраж'.encode('cp1251') in data
          assert b'##palatka_mobile' in data
          print('Main UI verified; arbitrage agent present; no MCR shell')
          PY
      - name: Publish full palatka_ai.lua to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add palatka_ai.lua
          if git diff --cached --quiet; then
            echo "Full script already up to date"
          else
            git commit -m "release: publish Palatka AI v2.9.3 standalone Lua"
            git push origin HEAD:main
          fi
      - name: Upload verified standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: palatka-v293-full-build
          path: palatka_ai.lua
          if-no-files-found: error
          retention-days: 7
