name: Palatka candidate validation (2.9.13 base)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'updates/**'
      - 'version.json'
      - 'build.py'
      - '.github/workflows/palatka-v287.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'updates/**'
      - 'version.json'
      - 'build.py'
      - '.github/workflows/palatka-v287.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stable-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y luajit
      - name: Compile promotional source and run state-machine regressions
        run: |
          luajit -b src/49a_promo_universal.lua /dev/null
          luajit -b src/49b_promo_mh_options.lua /dev/null
          luajit -b src/49c_promo_mh_scheduler_v294.lua /dev/null
          luajit -b src/68b_promo_universal_ui.lua /dev/null
          luajit tests/test_promo_scheduler_v294.lua
          luajit tests/test_promo_stability_v2914.lua
          luajit tests/test_promo_mh_options.lua
          luajit -b src/47_storage.lua /dev/null
          luajit tests/test_storage_snapshot_atomic_v2914.lua
          luajit -b src/42a_sell_stock_guard.lua /dev/null
          luajit tests/test_sell_unknown_stock_v2914.lua
      - name: Test OTA syntax, manifest and stable installer
        run: |
          luajit -b updates/palatka_update.lua /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json
          manifest=json.loads(Path('version.json').read_text())
          ota=Path('updates/palatka_update.lua').read_bytes()
          assert manifest['version']=='2.9.13'
          assert manifest['size']==len(ota),(manifest['size'],len(ota))
          assert manifest['mode']=='overlay'
          assert b"PALATKA_UPDATE_VERSION = '2.9.13'" in ota
          assert ota.count(b'return install_chrome_2913()')==2
          assert b'local function install_stable_2911()' in ota
          assert b'local function install_stock_2912()' in ota
          assert b'local function install_chrome_2913()' in ota
          assert b"local function install_v295()" in ota
          assert b"function A.draw()" in ota
          assert b"function V.promo_screen()" in ota
          assert b"function V.journal()" in ota
          print('OTA 2.9.13 compiled and validated')
          PY
      - name: Test stable modules and existing behavior
        run: |
          luajit -b src/59b_drop_sales_stats.lua /dev/null
          luajit -b src/49c_promo_mh_scheduler_v294.lua /dev/null
          luajit -b src/66e_mh_journal_fast_v295.lua /dev/null
          luajit tests/test_arbitrage_session.lua
          luajit tests/test_arbitrage_status.lua
          luajit tests/test_promo_templates.lua
          luajit tests/test_promo_scheduler_v294.lua
          luajit tests/test_mh_journal_screen_v294.lua
          luajit tests/test_perf_v295.lua
          luajit tests/test_active_ui_runtime.lua
      - name: Test partial-sale stock cap
        run: |
          luajit -b src/42a_sell_stock_guard.lua /dev/null
          luajit tests/test_v2912_partial_sell.lua
      - name: Test draggable top bar and centered dialogs
        run: |
          luajit -b src/60g_window_chrome_v2913.lua /dev/null
          luajit tests/test_v2913_chrome.lua
      - name: Build stable standalone
        run: python3 build.py
      - name: Verify standalone release version and retained UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('palatka_ai.lua').read_bytes()
          assert b'Palatka AI v2.9.13' in raw[:1000]
          assert b"script_version('2.9.13')" in raw[:1000]
          assert b'##palatka_arbitrage_agent' in raw
          assert b'##palatka_mobile' in raw
          assert 'Добавить строку'.encode('cp1251') in raw
          print('Stable standalone ready:',len(raw))
          PY
      - name: Publish standalone only after all checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add palatka_ai.lua
          if ! git diff --cached --quiet; then
            git commit -m "release: stable 2.9.13 standalone from verified 2.9.5 source"
            git push origin HEAD:main
          fi
      - name: Upload stable verified Lua
        uses: actions/upload-artifact@v4
        with:
          name: palatka-2.9.13-stable
          path: palatka_ai.lua
          retention-days: 14
