name: Palatka stability regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.py'
      - 'data/**'
      - 'icons/**'
      - '.github/workflows/stability-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit
          luajit -v
      - name: Build CP1251 candidate and verify LuaJIT syntax
        run: python3 build.py
      - name: Verify OTA upgrade payload can be compiled (no publish)
        run: python3 tools/build_ota_297.py --check
      - name: Verify stable 2.9.5-derived trading and UI regressions
        run: |
          luajit tests/test_arbitrage_session.lua
          luajit tests/test_arbitrage_status.lua
          luajit tests/test_promo_scheduler_v294.lua
          luajit tests/test_mh_journal_screen_v294.lua
          luajit tests/test_drop_sales_stats.lua
      - name: Historical regression suite (informational legacy checks)
        continue-on-error: true
        run: python3 run_tests.py
      - name: Explain historical regressions
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/test-results.json')
          if path.exists():
              checks=json.loads(path.read_text(encoding='utf-8'))
              passed=sum(row.get('exit_code')==0 for row in checks)
              print(f'Stable historical regression suite: {passed}/{len(checks)} passed.')
              print('Note: legacy v2.2 tests have known failures; strict OTA and release tests run separately.')
              with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write(f'Stable historical suite: {passed}/{len(checks)} passed. Native Android not tested.\n')
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palatka-test-results
          path: docs/test-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload standalone candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: palatka-ai-stability-candidate
          path: palatka_ai.lua
          compression-level: 0
          retention-days: 7
