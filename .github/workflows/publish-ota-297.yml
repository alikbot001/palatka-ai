name: Publish Palatka 2.9.7 in-game OTA
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/build_ota_297.py'
      - '.github/workflows/publish-ota-297.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palatka-ota-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit
      - name: Validate new code
        run: |
          python3 build.py
          luajit tests/test_v297_controls.lua
          luajit tests/test_v297_agent_persistence.lua
          luajit tests/test_v297_promo_scheduler.lua
          luajit tests/test_v297_unavailable_rollback.lua
      - name: Generate production overlay and version manifest
        run: |
          python3 tools/build_ota_297.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert data['version']=='2.9.7'
          assert data['mode']=='overlay'
          assert Path('updates/palatka_update.lua').stat().st_size==data['size']
          assert b"PALATKA_UPDATE_VERSION = '2.9.7'" in Path('updates/palatka_update.lua').read_bytes()
          print('Published payload size will be:',data['size'])
          PY
      - name: Publish to main for in-game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json updates/palatka_update.lua updates/palatka_update_v296.lua
          if git diff --staged --quiet; then
            echo 'Already published; nothing to commit'
          else
            git commit -m 'release: publish Palatka AI 2.9.7 in-game OTA'
            git push origin HEAD:main
          fi
      - name: Publish summary
        run: |
          echo 'Palatka 2.9.7 OTA and exact version.json manifest published to main.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Android MonetLoader validation still requires user confirmation.' >> "$GITHUB_STEP_SUMMARY"
